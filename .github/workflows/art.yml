# Adapted from Lombard .github/workflows/items.yml and bake.yml (17 November 2026)
name: art

# The Blender models (PR 13b): headless Blender runs every art script and
# commits the models back to the branch, then runs the deploy checks on it.
# Nobody opens the Blender UI.
#
# From the GitHub app: Actions → art → Run workflow → pick the branch → Run.
# Also runs when a push to a branch other than main changes art/**. It skips
# itself when the committed models were already built from these scripts
# (public/models/models.json holds their hash; tests/models.test.ts checks it).
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - 'art/**'
      - '!art/**/*.jpg'

permissions:
  contents: write
  actions: write

concurrency:
  group: art-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned on purpose, the same as Lombard and art/tunnel/build.py; bump deliberately.
  BLENDER_VERSION: '4.5.15'
  BLENDER_SERIES: '4.5'
  # Blender's own published checksum for this exact file (download.blender.org/release/Blender4.5/blender-4.5.15.sha256).
  # The download is refused unless it matches, on every run. Change it together with BLENDER_VERSION.
  BLENDER_SHA256: 0d2b8bb2efe97e6c8eb57de6b7322f8800e1984e3125b60decca5f6771e4773e

jobs:
  art:
    # Standard runner only: larger runners are always billed.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide whether to build
        id: plan
        run: |
          # The same hash as input_hash() in art/tunnel/build.py.
          hash=$(find art -name '*.py' | LC_ALL=C sort | xargs cat | sha256sum | cut -c1-16)
          current=$(jq -r '.inputHash // ""' public/models/models.json 2>/dev/null || true)
          run=true
          if [ '${{ github.event_name }}' = 'push' ] && [ "$current" = "$hash" ]; then run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "scripts $hash, committed models ${current:-none}, build: $run"

      # The cache holds Blender's download as it came (the .tar.xz), never an unpacked
      # copy. Any job in this repo can fill a cache, so what comes out of it is checked
      # against Blender's published checksum on every run, before it is unpacked and run.
      - name: Cache the Blender download
        if: steps.plan.outputs.run == 'true'
        id: blender-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/blender-dl
          key: blender-dl-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender ${{ env.BLENDER_VERSION }}
        if: steps.plan.outputs.run == 'true' && steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender-dl
          curl -fsSL --retry 3 -o ~/blender-dl/blender.tar.xz "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          echo "${BLENDER_SHA256}  $HOME/blender-dl/blender.tar.xz" | sha256sum -c -

      - name: Check and unpack Blender
        if: steps.plan.outputs.run == 'true'
        run: |
          # Every run, also when the file came from the cache. A mismatch stops the job here.
          echo "${BLENDER_SHA256}  $HOME/blender-dl/blender.tar.xz" | sha256sum -c -
          mkdir -p ~/blender
          tar -xJf ~/blender-dl/blender.tar.xz -C ~/blender --strip-components=1

      - name: Blender system libraries
        if: steps.plan.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6 libgl1 libegl1 libx11-6

      - name: Build the models
        if: steps.plan.outputs.run == 'true'
        run: |
          for script in art/*/build.py; do
            ~/blender/blender --background --factory-startup --python "$script" -- --preview
          done

      - name: Commit the models
        if: steps.plan.outputs.run == 'true'
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/models art
          if git diff --cached --quiet; then
            echo "models unchanged, nothing to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "Rebuild the Blender models"
          git push -q origin "HEAD:$GITHUB_REF_NAME"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Run the checks on the new models
        # A push made with the workflow's token doesn't start workflows by itself.
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
